spring.application.name=processor-service
server.port=8082

# RabbitMQ (en la laptop del PROCESSOR es localhost; cambiar con la variable RABBITMQ_HOST)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:flota}
spring.rabbitmq.password=${RABBITMQ_PASS:flota123}

# Si un mensaje falla no se reencola en bucle
spring.rabbitmq.listener.simple.default-requeue-rejected=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

#Administracion web en el puerto
#15672 que permite visualizar colas, exchanges, conexiones y mensajes en
#tiempo real
services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_broker
    environment:
      RABBITMQ_DEFAULT_USER: flota
      RABBITMQ_DEFAULT_PASS: flota123
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # panel web
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  processor:
    build: .
    container_name: processor_service
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: flota
      RABBITMQ_PASS: flota123
    ports:
      - "8082:8082"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

spring.application.name=storage-service
server.port=8083

# RabbitMQ (IP de la laptop del PROCESSOR, donde corre RabbitMQ)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:flota}
spring.rabbitmq.password=${RABBITMQ_PASS:flota123}
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# H2 en archivo: los datos sobreviven al reinicio
spring.datasource.url=jdbc:h2:file:${STORAGE_DB_PATH:./data/fleetdb}
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
